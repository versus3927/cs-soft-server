// ─────────────────────────────────────────────────────────────
//  server.cfg для CS2-сервера проекта CS SOFT
//  Кладётся в ./data/game/csgo/cfg/server.cfg
//  Пароли (RCON и вход) задаются в .env, здесь их нет.
// ─────────────────────────────────────────────────────────────

hostname "CS2 SOFT SERVER | рандомный софт каждый раунд"

// ── Формат игры: competitive ──
game_type 0
game_mode 1

// ── Базовые правила ──
mp_autoteambalance 1
mp_limitteams 2
mp_maxrounds 30
mp_roundtime 1.92            // 115 секунд, как в соревновательном
mp_roundtime_defuse 1.92
mp_freezetime 6
mp_buytime 20
mp_startmoney 800
mp_halftime 1
mp_match_end_restart 1
mp_overtime_enable 1
mp_overtime_maxrounds 6

// ── Дружественный огонь и урон ──
mp_friendlyfire 0
mp_tkpunish 1

// ── Экономика и оружие ──
mp_weapons_allow_zeus 1
mp_drop_knife_enable 1

// ── Сеть и стабильность ──
sv_lan 0
sv_hibernate_when_empty 0
sv_pure 0
sv_region 255
sv_cheats 0
sv_visiblemaxplayers 12

// ── Радар ──
sv_radar_always_centered 1
cl_radar_always_centered 1

// ── Логи и статистика ──
log on
sv_logbans 1
sv_log_onefile 0

// ── SourceTV (GOTV) ──
tv_enable 1
tv_port 27020
tv_delay 15

// ── Мост cs-soft (мост в docker-сети) ──
// Адрес и токен лучше держать в .env: CS_SOFT_BRIDGE / CS_SOFT_TOKEN.
// Если задаёшь здесь — раскомментируй:
// cs_soft_bridge "http://cs-soft:3000"
// cs_soft_token "токен_из_ROUNDS_TOKEN"

echo "server.cfg загружен: CS SOFT SERVER"
