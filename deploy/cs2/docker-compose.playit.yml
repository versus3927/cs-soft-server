# ─────────────────────────────────────────────────────────────
#  CS2 БЕЗ ПУБЛИЧНОГО IP / БЕЗ VPS — через туннель playit.gg
#
#  Зачем: если у тебя нет белого IP (домашний ПК, VPS без внешнего адреса)
#  или хостинг не даёт UDP, playit.gg прокидывает UDP-трафик CS2
#  через свой релей. Игроки подключаются по адресу вида
#      connect 12-34-56-78.playit.gg:12345
#
#  Запуск:
#     cd deploy/cs2
#     cp .env.example .env        # SRCDS_TOKEN + PLAYIT_SECRET
#     docker compose -f docker-compose.playit.yml up -d
#
#  БЕСПЛАТНОСТЬ: у playit.gg free-тариф ограничен.
#  Проверь актуальные условия: https://playit.gg/pricing
#  UDP на free-аккаунтах они периодически включают/выключают —
#  если туннель не поднимается, нужен план за ~$3/мес.
# ─────────────────────────────────────────────────────────────
services:
  cs2:
    image: joedwards32/cs2:latest
    container_name: cs2
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/home/steam/cs2-dedicated
    environment:
      CS_SOFT_BRIDGE: "http://cs-soft:3000"
      CS_SOFT_TOKEN: "${ROUNDS_TOKEN:-}"
    # Порты наружу НЕ публикуем — трафик пойдёт через туннель.
    # Оставляем их только внутри docker-сети.
    expose:
      - "27015"
      - "27020"
    depends_on:
      cs-soft:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  # ── туннель playit.gg: делает UDP-порты CS2 доступными из интернета ──
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit
    restart: unless-stopped
    environment:
      SECRET_KEY: "${PLAYIT_SECRET}"
    depends_on:
      - cs2

  cs-soft:
    build:
      context: ../..
      dockerfile: deploy/cs2/Dockerfile.bridge
    container_name: cs-soft
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ROUNDS_TOKEN: "${ROUNDS_TOKEN:-change-me-please}"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
